---
- name: Build network report
  hosts: group_cisco_routers
  gather_facts: false

  tasks:

    - name: Gather Cisco facts
      cisco.ios.ios_facts:
        gather_network_resources:
          - interfaces
          - l2_interfaces
          - l3_interfaces
          - vlans
      when: ansible_network_os == 'cisco.ios.ios'

    - name: Generate HTML report
      template:
        src: report.j2
        dest: "./reports/{{ inventory_hostname }}.html"
